<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CardTodo</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="light">

<!-- 顶部栏 -->
<header class="topbar">
  <span class="app-title">CardTodo</span>
  <button class="icon-btn" id="settingsBtn" title="设置">
    <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </svg>
  </button>
</header>

<!-- 主体 -->
<main class="main">
  <!-- 计数器 -->
  <div class="counter" id="counter">1 / 1</div>

  <!-- 卡片容器 -->
  <div class="card-viewport" id="cardViewport">
    <div class="card-track" id="cardTrack"></div>
  </div>

  <!-- 空状态 -->
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">✨</div>
    <div>暂无任务</div>
    <div class="empty-sub">点击右下角 + 添加第一个任务</div>
  </div>
</main>

<!-- FAB -->
<button class="fab" id="fabBtn">
  <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
  </svg>
</button>

<!-- 添加任务弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <h2 class="modal-title">新建任务</h2>
    <div class="form-group">
      <label>任务标题 *</label>
      <input type="text" id="inputTitle" placeholder="输入任务标题" maxlength="80" autocomplete="off">
    </div>
    <div class="form-group">
      <label>描述（可选）</label>
      <textarea id="inputDesc" placeholder="添加描述..." rows="3" maxlength="300"></textarea>
    </div>
    <div class="form-group">
      <label>优先级</label>
      <div class="priority-group">
        <button class="priority-btn" data-p="HIGH">🔴 高</button>
        <button class="priority-btn active" data-p="MEDIUM">🟡 中</button>
        <button class="priority-btn" data-p="LOW">🟢 低</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">取消</button>
      <button class="btn-add" id="addBtn">添加</button>
    </div>
  </div>
</div>

<!-- 设置面板 -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal settings-modal">
    <h2 class="modal-title">设置</h2>
    <div class="settings-row">
      <div>
        <div class="settings-label">深色模式</div>
        <div class="settings-sub">切换浅色 / 深色主题</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="darkToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="settings-divider"></div>
    <div class="settings-about">
      <div class="settings-label">CardTodo &nbsp;v1.1</div>
      <div class="settings-sub">卡片式任务管理，简单高效</div>
    </div>
    <div class="modal-actions">
      <button class="btn-add" id="settingsCloseBtn">关闭</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
